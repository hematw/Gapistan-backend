# Gapistan — local development stack
# Usage:
#   cp backend/.env.example backend/.env
#   cp frontend/.env.example frontend/.env
#   docker compose up -d

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:4173"
      PORT: "3000"
      MONGO_URI: "mongodb://mongo:27017/gapistan"
      JWT_SECRET: "${JWT_SECRET:-gapistanIsGreat}"
      E2EE_ENABLED: "${E2EE_ENABLED:-true}"
      E2EE_DEFAULT_ENABLED: "${E2EE_DEFAULT_ENABLED:-true}"
      LIVEKIT_API_KEY: "devkey"
      LIVEKIT_API_SECRET: "secret"
      MY_EMAIL: "${MY_EMAIL:-}"
      EMAIL_APP_PASS: "${EMAIL_APP_PASS:-}"
    volumes:
      - backend_uploads:/app/public/uploads
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "http://localhost:3000/api/v1"
        VITE_SOCKET_URL: "http://localhost:3000"
        VITE_FILES_URL: "http://localhost:3000"
        VITE_LIVEKIT_SERVER_URL: "ws://localhost:7880"
        VITE_E2EE_ENABLED: "${VITE_E2EE_ENABLED:-true}"
    restart: unless-stopped
    ports:
      - "4173:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_uploads:
